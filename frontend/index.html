<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/index.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <form action="" id="form-login" class="form glass" method="post">
            <h1>Login</h1>
            <p id="mensagem"></p>

                <div class="inputs">
                    <div class="row">
                        <label for="emailForm">E-mail</label>
                        <input type="text" id="emailForm" name="emailForm" placeholder="Insira o e-mail" required>
                        <small class="erro-texto"></small>
                    </div>
                    
                    <div class="row">
                        <label for="senhaForm">Senha</label>
                        <input type="password" id="senhaForm" name="senhaForm" placeholder="Insira a senha" required>
                        <small class="erro-texto"></small>
                    </div>
                </div>

                <button type="submit" class="btn">Entrar</button>
                <h5 class="log-txt">Não possui uma conta? <a href="register.html">Cadastre-se</a></h5>
        </form>
    </div>

    <script src="login.js"></script>
</body>
